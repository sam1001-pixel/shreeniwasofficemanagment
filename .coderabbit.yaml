# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Standard CodeRabbit configuration for new projects

language: "en-US"
tone_instructions: "Be concise, constructive, and prioritize critical security issues and bugs over stylistic preferences."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
